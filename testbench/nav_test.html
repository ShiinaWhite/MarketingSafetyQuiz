<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAV 导航回归测试（开发工具，不入 APK）</title>
<link rel="stylesheet" href="../www/css/style.css">
<style>
  #nav-report { position: fixed; right: 8px; top: 8px; z-index: 9999; max-width: 46vw;
    max-height: 80vh; overflow: auto; background: #fff; border: 2px solid #1565c0;
    border-radius: 8px; padding: 10px; font: 12px/1.7 Consolas, monospace; }
  #nav-report .pass { color: #0a7d32; } #nav-report .fail { color: #c62828; font-weight: 700; }
</style>
</head>
<body>
<!-- 完整复刻 www/index.html 的视图结构（app.js 启动期 bindEvents 需要全部元素），数据脚本以 fixture 内联替代
     VC16_UI_POLISH_V1：无首页相机按钮；无首页版本行；诊断入口在更新页当前版本行；
     启动更新 = Modal。URL 参数驱动 fake 更新服务：
       ?latestvc=16        fake latest versionCode（默认 15 = 与 fake App 相同 → 静默）
       ?updatedelay=2500   fake latest 延迟返回毫秒（UI16-13 抢操作场景）
       ?updatefail=1       fake latest 直接网络失败（UI16-12 静默场景） -->

<div id="app">

  <!-- 主菜单（UI_DESIGN_V1 同步：品牌区 + 搜题主入口 + 降级统计 + 练习模式；无相机入口） -->
  <section id="view-menu" class="view">
    <header class="brand">
      <div class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5.5 6v5c0 4.4 2.8 7.6 6.5 9.5 3.7-1.9 6.5-5.1 6.5-9.5V6Z"/><path d="m9 11.8 2.2 2.2L15.5 9.5"/></svg></div>
      <h1>营销安规刷题</h1>
      <p class="brand-sub">内部工具 · 快速搜题与练习</p>
    </header>
    <div id="search-entry-wrap" class="search-entry-wrap"></div>
    <div id="menu-stats" class="home-stats"></div>
    <div class="section-title">刷题练习</div>
    <div id="menu-buttons" class="grid"></div>
    <div class="menu-foot">
      <button id="btn-update" class="linkbtn" type="button">检查更新</button>
      <span class="menu-foot-sep" aria-hidden="true"></span>
      <button id="btn-settings" class="linkbtn" type="button">模拟考试设置</button>
      <span class="menu-foot-sep" aria-hidden="true"></span>
      <button id="btn-clear" class="linkbtn danger" type="button">清除学习记录</button>
    </div>
  </section>

  <!-- 刷题 / 模拟考试答题 -->
  <section id="view-quiz" class="view hidden">
    <header class="quiz-head">
      <button id="btn-back" class="backbtn">‹ 返回</button>
      <div id="quiz-title" class="qtitle"></div>
    </header>
    <main id="quiz-scroll">
      <p id="type-line" class="type-line hidden"></p>
      <div id="stem" class="stem"></div>
      <div id="options"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div id="explain-box" class="explain hidden">
        <button id="explain-toggle" type="button" class="explain-btn"></button>
        <div id="explain-body" class="explain-body hidden">
          <div class="explain-sec">
            <div class="explain-h">为什么这么选</div>
            <p id="explain-reason" class="explain-text"></p>
          </div>
          <div class="explain-sec memory">
            <div class="explain-h">记忆技巧</div>
            <p id="explain-memory" class="explain-text"></p>
          </div>
        </div>
      </div>
    </main>
    <footer class="quiz-bar">
      <button id="btn-prev" class="barbtn">上一题</button>
      <button id="btn-submit" class="barbtn primary hidden">提交答案</button>
      <button id="btn-jump" class="barbtn hidden">跳转</button>
      <button id="btn-next" class="barbtn">下一题</button>
      <button id="btn-handin" class="barbtn danger hidden">交卷</button>
    </footer>
  </section>

  <!-- 搜题 -->
  <section id="view-search" class="view hidden">
    <header class="quiz-head">
      <button id="btn-search-back" class="backbtn">‹ 返回</button>
      <div class="qtitle">搜题</div>
    </header>
    <div class="search-bar-wrap">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input id="search-input" type="search" placeholder="输入题干关键词" autocomplete="off"
               enterkeyhint="search" inputmode="search" aria-label="搜题">
        <button id="btn-search-clear" class="field-clear hidden" type="button" aria-label="清除搜索词"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <button id="btn-batch-photo" class="camera-btn" type="button" aria-label="拍整页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5C4 7.4 4.9 6.5 6 6.5h1.6l1.2-1.7c.3-.4.7-.6 1.2-.6h4c.5 0 .9.2 1.2.6l1.2 1.7H18c1.1 0 2 .9 2 2v8.4c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2Z"/><circle cx="12" cy="12.6" r="3.4"/></svg></button>
    </div>
    <div id="search-filters" class="search-filters" role="group" aria-label="题型筛选">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-btn" data-filter="single" aria-pressed="false">单选</button>
      <button type="button" class="filter-btn" data-filter="multi" aria-pressed="false">多选</button>
      <button type="button" class="filter-btn" data-filter="judge" aria-pressed="false">判断</button>
    </div>
    <main id="search-scroll">
      <div id="search-history" class="search-history hidden"></div>
      <div id="search-count" class="search-count hidden"></div>
      <div id="search-results"></div>
      <div id="search-empty" class="empty">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></div>
        <p class="t">输入关键词搜题</p>
        <p class="s">支持题干或选项关键词<br>也可以点相机，拍一整页试卷</p>
      </div>
    </main>
  </section>

  <!-- 整页答案（相机直拍直达，无中转页） -->
  <section id="view-batch-results" class="view hidden">
    <header class="quiz-head">
      <button id="btn-batch-results-back" class="backbtn">‹ 首页</button>
      <div class="qtitle">整页答案</div>
    </header>
    <main id="batch-scroll" class="pad">
      <div id="batch-summary" class="batch-summary"></div>
      <div id="batch-list"></div>
      <div id="batch-tools"></div>
      <div id="batch-sample-tools" class="sample-tools">
        <button id="btn-sample-flag" class="linkbtn hidden" type="button">反馈本页问题</button>
        <div id="sample-feedback-panel" class="sample-feedback-panel hidden"></div>
      </div>
    </main>
  </section>

  <!-- 搜题详情 -->
  <section id="view-search-detail" class="view hidden">
    <header class="quiz-head">
      <button id="btn-detail-back" class="backbtn">‹ 搜索</button>
      <div class="qtitle">题目详情</div>
    </header>
    <main id="search-detail-body" class="pad"></main>
  </section>

  <!-- DEV 隐藏诊断（VC17：显示层全中文；入口 = 检查更新页当前版本行 7 连击，仅 DEV 构建） -->
  <section id="view-devdiag" class="view hidden">
    <header class="quiz-head">
      <button id="btn-devdiag-back" class="backbtn">‹ 返回</button>
      <div class="qtitle">开发者诊断</div>
    </header>
    <main id="devdiag-body" class="pad"></main>
  </section>

  <!-- 检查更新（SELF_UPDATE_V1，仅手动检查） -->
  <section id="view-update" class="view hidden">
    <header class="quiz-head">
      <button id="btn-update-back" class="backbtn">‹ 返回</button>
      <div class="qtitle">检查更新</div>
    </header>
    <main class="pad">
      <p id="update-current" class="dim"></p>
      <div id="update-body"></div>
      <p id="update-error" class="batch-hint hidden"></p>
    </main>
  </section>

  <!-- 考试成绩 -->
  <section id="view-result" class="view hidden">
    <header class="quiz-head"><div class="qtitle center">模拟考试成绩</div></header>
    <main id="result-body" class="pad"></main>
  </section>

  <!-- 考试错题回顾 -->
  <section id="view-review" class="view hidden">
    <header class="quiz-head">
      <button id="btn-review-back" class="backbtn">‹ 成绩</button>
      <div id="review-title" class="qtitle"></div>
    </header>
    <main id="review-body" class="pad"></main>
  </section>

</div>
<div id="modal-root" class="hidden"></div>

<div id="nav-report">运行中…</div>

<script>
/* 内联 fixture 题库 + fake Capacitor 插件（必须在 app.js 之前注入） */
(function () {
  const S = (id, stem, opts, ans) => ({ id, major: "NAV", type: "single", stem, options: opts, answer: ans });
  const qs = [];
  const stems = [
    "NAVTEST 卡式电能表检定装置的试验变换器部分每（　）至少送检一次，检定项目包括绝缘电阻测定与工频耐压试验。",
    "NAVTEST 现场检验计量装置时，工作人员应携带试验用的仪表设备，并遵守（　）的相关安全规定。",
    "NAVTEST 计量箱（柜）内使用的开关设备应当具备（　）功能，防止因过载引发火灾事故。",
    "NAVTEST 低压带电作业应设专人监护，使用有绝缘柄的工具，工作时站在（　）上进行，同时穿戴绝缘防护用品。",
    "NAVTEST 电能计量装置的二次回路连接导线应采用铜质单芯绝缘导线，其截面积不应小于（　）平方毫米。",
    "NAVTEST 新装与拆换电能表作业开始前，应当（　）方可开展工作，防止误碰带电设备。",
    "NAVTEST 用电信息采集终端安装作业中，通信天线的安装位置应当（　），并可靠固定，避免信号遮挡。",
    "NAVTEST 现场校验电流互感器时，严禁（　），防止产生高电压危及人身与设备安全。",
    "NAVTEST 计量装置的轮换计划应结合（　）统一安排，确保现场作业与停电计划相衔接。",
    "NAVTEST 采集终端与电能表之间的通信规约应当符合（　）的要求，保证数据抄读准确可靠。",
    "NAVTEST 检定装置在使用前应当检查（　）是否完好，发现异常应当立即停止使用并登记。",
    "NAVTEST 拆装电能表时，二次侧电流回路应（　）后方可拆线，防止开路产生危险。",
    "NAVTEST 现场作业完毕后应当（　），并清理现场，确认无遗留工具后方可撤离。",
    "NAVTEST 计量自动化系统主站应当对采集数据进行（　），发现异常数据应当及时现场核实。"
  ];
  stems.forEach((stem, i) => {
    qs.push(S(9001 + i, stem, ["定期", "不定期", "按需", "口头约定"], [i % 4]));
  });
  qs.push({ id: 9101, major: "NAV", type: "multi", stem: "NAVTEST 现场校验作业时应采取的安全措施包括（　）。", options: ["专人监护", "戴绝缘手套", "先停电再作业", "随意操作"], answer: [0, 1, 2] });
  qs.push({ id: 9102, major: "NAV", type: "multi", stem: "NAVTEST 电能表接线检查的内容包括（　）。", options: ["相序正确", "极性正确", "接地可靠", "导线颜色随意"], answer: [0, 1, 2] });
  qs.push({ id: 9201, major: "NAV", type: "judge", stem: "NAVTEST 现场校验可以不办理任何手续直接进行。", options: ["正确", "错误"], answer: [1] });
  window.QUESTIONS_DATA = { total: qs.length, questions: qs };
  window.__NAV_FIXTURE = qs;

  /* OCR fixture：12 道单选题的整页行（含坐标） */
  window.__ocrFixture = function () {
    const lines = [];
    let y = 60;
    const singles = qs.filter((q) => q.type === "single");
    singles.forEach((q, i) => {
      const line = (t) => { lines.push({ text: t, left: 40, top: y, right: 900, bottom: y + 42 }); y += 48; };
      line((21 + i) + ". " + q.stem);
      q.options.forEach((o, k) => line("ABCD"[k] + ". " + o));
    });
    return { text: lines.map((l) => l.text).join("\n"), ms: 8, width: 1000, height: y + 100, lines };
  };
})();

  const Q = new URLSearchParams(location.search);
  window.__c = { ocr: 0, match: 0, split: 0, auto: 0, http: 0 };
  window.__order = [];   /* SUC17 时序观测：getInfo / update-fetch / menu-ready */
  window.__feedbackCalls = [];
  window.__httpFail = 0;
  window.__queuePersisted = [];
  window.__queueFeedbacks = [];
  window.__cameraReject = null;
  window.__queuePersistFail = 0;
  window.__janitorRuns = [];
  window.__queueListener = null;
  window.__updateFetches = 0;   /* fake OTA latest 请求计数（UI16-7 一次性验证） */
  window.Capacitor = { Plugins: {
    App: {
      getInfo: async () => {
        window.__order.push("getInfo");   /* SUC17-1：trigger 在 bootstrap 期即调用 */
        return { id: "com.jty.safetyquiz.dev", version: "1.0.15-dev", build: "15" };
      },
      addListener: () => ({ remove: () => {} }),
      exitApp: () => {}
    },
    Camera: { getPhoto: async () => {
      if (window.__cameraReject) {
        const m = window.__cameraReject;
        window.__cameraReject = null;
        throw new Error(m);
      }
      return { dataUrl: "data:image/jpeg;base64,QUJD" };
    } },
    Ocr: { recognizeText: async () => { window.__c.ocr += 1; return window.__ocrFixture(); } },
    CapacitorHttp: { request: async (opts) => {
        const url = (opts && opts.url) || "";
        if (url.indexOf("/api/update/") >= 0 && url.indexOf("/latest") >= 0) {
          /* fake OTA latest 服务：URL 参数控制版本/延迟/失败（VC16/VC17 测试驱动） */
          window.__order.push("update-fetch");
          window.__updateFetches += 1;
          const vc = parseInt(Q.get("latestvc") || "15", 10);
          const delay = parseInt(Q.get("updatedelay") || "0", 10) || 0;
          const fail = Q.get("updatefail") === "1";
          await new Promise((r) => setTimeout(r, delay));
          if (fail) { throw new Error("simulated dns failure"); }
          return { status: 200, data: {
            schemaVersion: 1, channel: "dev", packageName: "com.jty.safetyquiz.dev",
            versionCode: vc, versionName: "1.0." + vc + "-dev",
            sha256: "a".repeat(64), size: 17209403,
            apkUrl: "https://apk.shiinalab.top/dev/vc" + vc + "/msq-dev-vc" + vc + ".apk",
            fallbackApkUrl: "/api/update/dev/apk",
            notes: "界面优化与问题修复"
          } };
        }
        window.__c.http += 1;
        if (url.indexOf("/api/feedback") >= 0) {
          window.__feedbackCalls.push(JSON.parse(JSON.stringify(opts.data || {})));
        }
        if (window.__httpFail > 0) { window.__httpFail -= 1; return { status: 500, data: { ok: false } }; }
        return { status: 200, data: { ok: true } };
      } },
    SampleQueue: {
      setServer: async () => ({ ok: true }),
      init: async () => ({ ok: true, recovered: 0, removed: 0 }),
      addListener: (ev, cb) => { window.__queueListener = cb; return { remove: () => {} }; },
      persistSample: async (o) => {
        if (window.__queuePersistFail > 0) {
          window.__queuePersistFail -= 1;
          throw new Error("IO_ERROR disk full");
        }
        window.__queuePersisted.push({
          sampleId: o.sampleId,
          dataUrlLen: (o.photoDataUrl || "").length,
          runJson: JSON.parse(o.runJson)
        });
        return { ok: true, sampleId: o.sampleId };
      },
      persistFeedback: async (o) => {
        if (window.__queueFeedbackFail > 0) {
          window.__queueFeedbackFail -= 1;
          throw new Error("IO_ERROR");
        }
        window.__queueFeedbacks.push(JSON.parse(o.feedbackJson));
        return { ok: true, sampleId: o.sampleId };
      },
      stats: async () => ({ ok: true, pending: 0, uploading: 0, retryWait: 0, failed: 0,
        authFailed: 0, uploaded: 2, pendingBytes: 4 * 1024 * 1024 }),
      retryFailed: async () => ({ ok: true, retried: 0 }),
      cleanupFailed: async () => ({ ok: true, deleted: 0, failedToDelete: 0, bytesFreed: 0 }),
      getDiagnostics: async () => ({
        ok: true, oldestSampleAgeMs: 3600_000, lastUploadBytesPerSec: 3_900_000,
        feedbackPendingCount: 0, lastJanitorAt: Date.now() - 3600_000,
        deletedSamples: 3, deletedBytes: 48 * 1024 * 1024,
        queueBytesBefore: 300 * 1024 * 1024, queueBytesAfter: 252 * 1024 * 1024
      }),
      runJanitorNow: async () => { window.__janitorRuns.push(1); return { ok: true }; }
    }
  } };

  /* SUC17：观测主菜单渲染完成（renderMenu 向 menu-buttons 填充按钮） */
  (function () {
    const mb = document.getElementById("menu-buttons");
    const mo = new MutationObserver(() => {
      if (mb.children.length > 0 && window.__order.indexOf("menu-ready") < 0) {
        window.__order.push("menu-ready");
      }
    });
    mo.observe(mb, { childList: true });
  })();
</script>
<script src="../www/js/core.js"></script>
<script src="../www/js/icons.js"></script>
<script src="../www/js/sample-collector.js"></script>

<script src="../www/js/app.js"></script>
<script>
(async function () {
  const R = [];
  const check = (id, cond, info) => { R.push({ id, pass: !!cond, info: info == null ? "" : String(info) }); };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const poll = async (fn, timeout) => {
    const t0 = Date.now();
    while (Date.now() - t0 < (timeout || 6000)) {
      try { const v = fn(); if (v) { return v; } } catch (e) { }
      await sleep(60);
    }
    return null;
  };
  const vis = (id) => { const v = document.getElementById(id); return !!v && !v.classList.contains("hidden"); };
  const modalVisible = () => vis("modal-root");
  const modalText = () => (document.getElementById("modal-root").innerText || "");

  const Q = new URLSearchParams(location.search);
  const isFailRun = Q.get("updatefail") === "1";
  const isLateRun = !isFailRun && Q.get("latestvc") === "16" && !!Q.get("updatedelay");
  const isModalRun = !isFailRun && !isLateRun && Q.get("latestvc") === "16";
  let batchPhotoEverVisible = false;
  setInterval(() => { if (vis("view-batch-photo")) { batchPhotoEverVisible = true; } }, 30);

  try {
    /* ============ UI16-12：网络失败 → 完全静默 ============ */
    if (isFailRun) {
      await poll(() => document.querySelector("#menu-buttons button"));
      await sleep(2500);   /* 等 fake 失败返回 */
      check("UI16-12 网络失败：无 Modal、无跳转、留在首页",
        !modalVisible() && vis("view-menu") && !vis("view-update"));
      check("UI16-12b 检查确实发起过一次（失败被吞掉）", window.__updateFetches === 1);
    }
    /* ============ UI16-13：用户已离开首页 → 不抢弹 ============ */
    else if (isLateRun) {
      await poll(() => document.querySelector("#menu-buttons button"));
      await sleep(80);
      document.getElementById("btn-search-entry").click();   /* 检查返回前就离开首页 */
      check("UI16-13a 已进入搜题页", vis("view-search"));
      check("SUC17-1b 此时 fetch 早已发出、响应未回（请求与初始化并行）",
        window.__updateFetches === 1);
      await sleep(3200);   /* fake latest 2.5s 后返回 vc16 */
      check("UI16-13b 结果返回时不弹 Modal、不打断操作",
        !modalVisible() && vis("view-search") && !vis("view-update"));
      check("UI16-13c 本次检查只发生一次且被放弃", window.__updateFetches === 1);
      window.handleBack();
      await sleep(120);
      check("UI16-13d 回首页后也不补弹（one-shot 已消耗）",
        vis("view-menu") && !modalVisible() && window.__updateFetches === 1);
    }
    /* ============ UI16-4~9：有新版 → Modal ============ */
    else if (isModalRun) {
      await poll(() => document.querySelector("#menu-buttons button"));
      const modal = await poll(modalVisible, 4000);
      check("UI16-4 启动检查到新版 → 首页弹出更新 Modal", !!modal);
      const mt = modalText();
      check("UI16-4b Modal 内容：最新/当前版本 + 稍后/立即更新",
        mt.indexOf("发现新版本") >= 0 && mt.indexOf("1.0.16-dev") >= 0 &&
        mt.indexOf("1.0.15-dev") >= 0 && mt.indexOf("稍后") >= 0 &&
        mt.indexOf("立即更新") >= 0, mt.slice(0, 80));
      check("UI16-4c Modal 无任何技术信息（URL/SHA/大小/渠道）",
        mt.indexOf("apk") < 0 && mt.indexOf("http") < 0 && mt.indexOf("SHA") < 0 &&
        mt.indexOf("shiinalab") < 0 && mt.indexOf("17209403") < 0);
      check("UI16-5 不再自动导航到更新页（留在首页）",
        !vis("view-update") && vis("view-menu"));
      /* 稍后（keepmodal=1 为截图模式：保留 Modal 供人工/截图核对，跳过关闭类断言） */
      if (Q.get("keepmodal") !== "1") {
        Array.from(document.querySelectorAll("#modal-root .barbtn"))
          .find((b) => b.textContent === "稍后").click();
        await sleep(120);
        check("UI16-6 稍后 → Modal 消失且留在首页",
          !modalVisible() && vis("view-menu") && !vis("view-update"));
        /* 本 session 不再弹 */
        document.getElementById("btn-search-entry").click();
        await sleep(100);
        window.handleBack();
        await sleep(100);
        await sleep(700);
        check("UI16-7 本 session 不重复弹（导航一圈后仍无 Modal，检查仅 1 次）",
          !modalVisible() && vis("view-menu") && window.__updateFetches === 1);
        check("UI16-7b Modal 仍可用 Back 关闭 = 稍后（onClose 标记 dismissed 已生效）",
          window.__updateFetches === 1);
      }
    }
    /* ============ 基础套件：NAV/FB/CAP/UI16-1/2/3/10/11 + DIAG ============ */
    else {
      await poll(() => document.querySelector("#menu-buttons button"));
      await sleep(200);

      window.__c = { ocr: 0, match: 0, split: 0, auto: 0, http: 0 };
      window.__feedbackCalls.length = 0;
      window.__httpFail = 0;
      window.__queuePersisted.length = 0;
      window.__queueFeedbacks.length = 0;

      const wrap = (name, key) => {
        const orig = window.MSQ[name];
        window.MSQ[name] = function () { window.__c[key] += 1; return orig.apply(this, arguments); };
      };
      wrap("searchPageQuestionsByOcr", "match");
      wrap("splitPageOcrLines", "split");
      wrap("recomputePageFromLines", "auto");

      /* —— UI16-1/11：首页无相机大按钮、无版本行；启动无新版完全静默 —— */
      check("UI16-1 首页无「拍整页搜题」按钮（只有搜题入口）",
        !document.getElementById("btn-camera-entry") &&
        !!document.getElementById("btn-search-entry") &&
        document.getElementById("view-menu").innerText.indexOf("拍整页搜题") < 0);
      check("UI16-1b 首页无诊断版本行（DIAG-7）",
        !document.getElementById("menu-version"));
      /* —— UI18 偏差守卫（UI_REDESIGN_IMPLEMENTATION_V1 人工修订项） —— */
      check("UI18-1 产品名保持「营销安规刷题」",
        (document.querySelector("#view-menu h1") || {}).textContent === "营销安规刷题");
      check("UI18-2 首页无任何相机入口/相机文案",
        !document.querySelector("#view-menu .camera-btn") &&
        !document.querySelector("#view-menu .photo-btn") &&
        !document.getElementById("btn-camera-entry") &&
        document.getElementById("view-menu").innerText.indexOf("相机") < 0 &&
        document.getElementById("view-menu").innerText.indexOf("拍整页") < 0);
      check("UI18-3 搜题页相机入口唯一（搜索框右侧）",
        document.querySelectorAll("#view-search .camera-btn").length === 1);
      const appAllText = document.getElementById("app").textContent;
      check("UI18-4 全 UI 无「数据仅保存在本机」", appAllText.indexOf("数据仅保存在本机") < 0);
      check("UI18-5 全 UI 无「完全离线」", appAllText.indexOf("完全离线") < 0);
      check("UI18-6 全 UI 无「DEV BUILD ONLY」",
        document.getElementById("app").textContent.indexOf("DEV BUILD ONLY") < 0);
      check("UI16-11 无新版 → 启动完全静默（无 Modal、不跳更新页）",
        !modalVisible() && vis("view-menu") && !vis("view-update") &&
        window.__updateFetches === 1);
      check("SUC17-1 启动 fetch 在主菜单渲染完成前已发起（getInfo 先于 menu-ready）",
        window.__order.indexOf("getInfo") >= 0 &&
        window.__order.indexOf("menu-ready") >= 0 &&
        window.__order.indexOf("getInfo") < window.__order.indexOf("menu-ready"),
        JSON.stringify(window.__order));
      check("SUC17-2 fetch 不阻塞 loadBank（菜单照常渲染，boot 正常完成）",
        document.querySelectorAll("#menu-buttons button").length >= 3);

      /* —— NAV-A：search → detail → 返回 —— */
      const searchBtn = document.getElementById("btn-search-entry");
      searchBtn.click();
      check("NAV-A1 进入搜题页", vis("view-search"));
      const input = document.getElementById("search-input");
      input.value = "NAVTEST";
      input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
      await poll(() => document.querySelector("#search-results .search-item"));
      document.querySelector("#search-results .search-item").click();
      check("NAV-A2 打开题目详情", vis("view-search-detail"));
      document.getElementById("btn-detail-back").click();
      check("NAV-A3 左上角返回 → 搜题页", vis("view-search") && !vis("view-search-detail"));

      /* —— CAP-S2 / UI16-3：旧中转页不存在 —— */
      check("UI16-3 旧整页拍照页仍不存在",
        !document.getElementById("view-batch-photo") &&
        !document.getElementById("btn-take-page") &&
        !document.getElementById("batch-type-row"));

      /* —— UI16-2 / NAV-B：搜题框右侧 📷 直接拍摄 —— */
      document.getElementById("btn-batch-photo").click();
      await poll(() => document.querySelector("#batch-list .batch-row"));
      await sleep(120);
      check("UI16-2 搜题框右侧相机 → 直接拍摄 → 整页答案（无中转页）",
        vis("view-batch-results") &&
        document.querySelectorAll("#batch-list .batch-row").length >= 10 &&
        !batchPhotoEverVisible);
      check("CAP-S4 拍摄固定 AUTO（run.json pageTypeMode=auto）",
        window.__queuePersisted.length >= 1 &&
        window.__queuePersisted[0].runJson.pageTypeMode === "auto");
      check("CAP-S6 拍摄后样本已后台自动 persist", window.__queuePersisted.length === 1);

      const c0 = JSON.parse(JSON.stringify(window.__c));
      const rows = Array.from(document.querySelectorAll("#batch-list .batch-row"));
      const openRow = rows[rows.length - 2];
      openRow.click();
      const candBtns = openRow.nextElementSibling.querySelectorAll(".batch-cand");
      check("NAV-E0 展开题块且 Top3 候选可见",
        openRow.classList.contains("open") && candBtns.length >= 1);
      candBtns[Math.min(1, candBtns.length - 1)].click();
      check("NAV-B2 打开 Top2 原题详情", vis("view-search-detail"));
      document.getElementById("btn-detail-back").click();
      check("NAV-B3 返回 → 整页答案", vis("view-batch-results") && !vis("view-search-detail"));
      check("NAV-F/G 详情返回零重算零 OCR",
        window.__c.ocr === c0.ocr && window.__c.match === c0.match &&
        window.__c.split === c0.split && window.__c.auto === c0.auto);

      /* —— UI16-2b 相机取消：回到搜题页（无中转页残留） —— */
      window.handleBack();   /* 整页答案 → 首页 */
      await sleep(100);
      document.getElementById("btn-search-entry").click();   /* 从搜题页发起拍摄 */
      await sleep(100);
      window.__cameraReject = "No image captured (cancelled)";
      document.getElementById("btn-batch-photo").click();
      await sleep(150);
      check("UI16-2b 相机取消 → 静默回搜题页（无 Modal、无旧页面）",
        vis("view-search") && !modalVisible() &&
        document.getElementById("modal-root").classList.contains("hidden"));

      /* —— 结果页题型人工纠错保留 —— */
      document.getElementById("btn-batch-photo").click();
      await poll(() => document.querySelector("#batch-list .batch-row"));
      await sleep(120);
      const ocrBeforeSwitch = window.__c.ocr;
      const autoBeforeSwitch = window.__c.auto;
      const typeLine = document.querySelector("#batch-summary .batch-type-line");
      typeLine.querySelector(".linkbtn").click();
      const switchBtns = typeLine.querySelectorAll(".batch-type-switch .batch-type-btn");
      Array.from(switchBtns).find((b) => b.textContent === "单选题").click();
      await sleep(150);
      check("CAP-S5 结果页切题型重算零 OCR",
        vis("view-batch-results") && window.__c.ocr === ocrBeforeSwitch &&
        window.__c.auto === autoBeforeSwitch + 1);

      /* —— UI18-8/9：普通 UI 无耗时文本；run.json 耗时字段仍完整保留 —— */
      const batchText = document.getElementById("batch-scroll").innerText;
      check("UI18-8 整页普通 UI 无 OCR/分题/匹配/合计耗时",
        !/识别 \d+ ?ms|分题 \d+ ?ms|匹配 \d+ ?ms|合计 \d+ ?ms/.test(batchText) &&
        batchText.indexOf("ms ·") < 0 && batchText.indexOf("道题已识别") >= 0,
        batchText.slice(0, 60));
      const lastRun = window.__queuePersisted[window.__queuePersisted.length - 1];
      check("UI18-9 run.json 耗时字段仍保留（timing 采集不删）",
        !!lastRun && !!lastRun.runJson.timing &&
        typeof lastRun.runJson.timing.ocrMs === "number" &&
        typeof lastRun.runJson.timing.totalMs === "number");

      /* —— UI16-10：手动检查更新行为不变（无新版 → 已是最新版） —— */
      window.handleBack();   /* 整页答案 → 首页 */
      await sleep(100);
      check("NAV-J1 整页答案 back → 首页", vis("view-menu") && !vis("view-batch-results"));
      document.getElementById("btn-update").click();
      await poll(() => (document.getElementById("update-body").innerText || "").indexOf("当前版本") >= 0);
      document.getElementById("btn-update-check").click();
      await poll(() => (document.getElementById("update-body").innerText || "").indexOf("已经是最新版") >= 0);
      check("UI16-10 手动检查：无新版显示「已经是最新版」（原交互）",
        vis("view-update") &&
        document.getElementById("update-body").innerText.indexOf("已经是最新版") >= 0);

      /* —— DIAG：更新页当前版本行 7 连击（仅 DEV；fake App 为 dev 包名） —— */
      document.getElementById("btn-update-back").click();   /* 回菜单再进，重建版本行 */
      await sleep(100);
      document.getElementById("btn-update").click();
      const verLine = await poll(() => {
        const p = document.querySelector("#update-body p.dim");
        return (p && p.textContent.indexOf("当前版本") === 0) ? p : null;
      });
      check("DIAG-2a 版本行存在且为整行块级元素（全宽可点）",
        !!verLine && verLine.getBoundingClientRect().width > 200,
        verLine && Math.round(verLine.getBoundingClientRect().width));
      /* DIAG-3：6 次 → 不进入 */
      for (let i = 0; i < 6; i++) { verLine.click(); }
      await sleep(80);
      check("DIAG-3 少于 7 次不进入", !vis("view-devdiag") && vis("view-update"));
      /* DIAG-4：超 3 秒计数重置。计数器是全局的，每批之间必须留 >3s 让上一批过期 */
      await sleep(3200);   /* 先让 DIAG-3 的 6 次计数自然过期 */
      for (let i = 0; i < 6; i++) { verLine.click(); }
      await sleep(80);
      check("DIAG-4a 过期后 6 次不进入", !vis("view-devdiag") && vis("view-update"));
      await sleep(3200);   /* 再次重置窗口 */
      for (let i = 0; i < 6; i++) { verLine.click(); }
      await sleep(80);
      check("DIAG-4b 两批 6 次（间隔 >3s）均不进入（计数不跨窗口累计）",
        !vis("view-devdiag") && vis("view-update"));
      /* DIAG-1：重置后 7 连击进入 */
      await sleep(3200);
      for (let i = 0; i < 7; i++) { verLine.click(); }
      await sleep(120);
      check("DIAG-1 DEV 更新页当前版本 7 连击进入诊断页",
        vis("view-devdiag"));
      const ddText = document.getElementById("devdiag-body").innerText;
      check("DIAG17-1/2/3 诊断页全中文：中文状态项+状态映射+中文按钮，无英文标签",
        ddText.indexOf("待上传样本") >= 0 && ddText.indexOf("等待重试") >= 0 &&
        ddText.indexOf("上传失败") >= 0 && ddText.indexOf("需要重新绑定") >= 0 &&
        ddText.indexOf("队列占用空间") >= 0 && ddText.indexOf("最老样本等待时间") >= 0 &&
        ddText.indexOf("最近上传速度") >= 0 && ddText.indexOf("上次自动清理") >= 0 &&
        ddText.indexOf("上次清理样本数") >= 0 && ddText.indexOf("上次释放空间") >= 0 &&
        ddText.indexOf("最近反馈同步状态") >= 0 && ddText.indexOf("已同步") >= 0 &&
        Array.from(document.querySelectorAll("#devdiag-body .barbtn"))
          .map((b) => b.textContent).indexOf("立即清理") >= 0 &&
        Array.from(document.querySelectorAll("#devdiag-body .barbtn"))
          .map((b) => b.textContent).indexOf("立即重试") >= 0 &&
        !/pending|retry|failed|auth|synced|janitor|queue total|Run |Retry |never/i.test(ddText),
        ddText.slice(0, 100));
      check("DIAG17-1b 标题为「开发者诊断」",
        document.querySelector("#view-devdiag .qtitle").textContent === "开发者诊断");
      /* —— UI18-6b/7：诊断页「仅开发版」badge、无 DEV BUILD、可见文字全中文 —— */
      check("UI18-7 诊断页「仅开发版」badge 且无 DEV BUILD 字样",
        document.getElementById("devdiag-body").innerText.indexOf("仅开发版") >= 0 &&
        document.getElementById("devdiag-body").innerText.indexOf("DEV BUILD") < 0);
      check("UI18-10 stable 渠道无诊断入口（diagnosticsChannel 映射不变）",
        window.MSQSample.diagnosticsChannel("com.jty.safetyquiz") === "stable" &&
        window.MSQSample.diagnosticsChannel("com.jty.safetyquiz.dev") === "dev" &&
        window.MSQSample.diagnosticsChannel("com.other.app") === null);
      check("DIAG-2b 整行点击均有效（同一行上 7 次点击全部计数）",
        vis("view-devdiag"));
      /* DIAG-6：Back → 检查更新页（按钮 + 系统 Back 双路） */
      document.getElementById("btn-devdiag-back").click();
      await sleep(120);
      check("DIAG-6a 诊断页返回按钮 → 检查更新页",
        vis("view-update") && !vis("view-devdiag"));
      const verLine2 = document.querySelector("#update-body p.dim");
      for (let i = 0; i < 7; i++) { verLine2.click(); }
      await sleep(120);
      window.handleBack();
      await sleep(120);
      check("DIAG-6b 系统 Back → 检查更新页（不回首页、无异常 history）",
        vis("view-update") && !vis("view-devdiag") && !vis("view-menu"));
      /* DIAG-5：MAIN 不响应 —— 源码级守卫见 test_core（browser fake 恒为 dev 包名） */
      check("DIAG-5 浏览器侧前置：手势只绑定在版本行（其余区域点击无副作用）",
        vis("view-update"));

      /* —— FB：反馈交互保留 —— */
      window.handleBack();   /* 更新页 → 首页 */
      await sleep(80);
      check("FB-NAV 更新页返回 → 首页", vis("view-menu"));
    }
  } catch (e) {
    R.push({ id: "HARNESS", pass: false, info: String((e && e.stack) || e) });
  }

  window.__NAV_RESULTS = R;
  const box = document.getElementById("nav-report");
  box.innerHTML = "";
  let fails = 0;
  R.forEach((r) => {
    if (!r.pass) { fails += 1; }
    const p = document.createElement("div");
    p.className = r.pass ? "pass" : "fail";
    p.textContent = "[" + (r.pass ? "PASS" : "FAIL") + "] " + r.id + (r.info ? "  (" + r.info + ")" : "");
    box.appendChild(p);
  });
  const head = document.createElement("h3");
  head.textContent = "结果：" + (fails ? fails + " 项失败 ✗" : "全部通过 ✓") + "（" + R.length + " 项）";
  head.className = fails ? "fail" : "pass";
  box.insertBefore(head, box.firstChild);
  console.log("NAV_RESULTS", JSON.stringify(R));
})();
</script>
</body>
</html>
