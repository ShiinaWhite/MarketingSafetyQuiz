<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAV 导航回归测试（开发工具，不入 APK）</title>
<link rel="stylesheet" href="../www/css/style.css">
<style>
  #nav-report { position: fixed; right: 8px; top: 8px; z-index: 9999; max-width: 46vw;
    max-height: 80vh; overflow: auto; background: #fff; border: 2px solid #1565c0;
    border-radius: 8px; padding: 10px; font: 12px/1.7 Consolas, monospace; }
  #nav-report .pass { color: #0a7d32; } #nav-report .fail { color: #c62828; font-weight: 700; }
</style>
</head>
<body>
<!-- 完整复刻 www/index.html 的视图结构（app.js 启动期 bindEvents 需要全部元素），数据脚本以 fixture 内联替代
     SIMPLIFY_CAPTURE_FLOW_V1：无 view-batch-photo 中转页；新增 view-devdiag；menu-version 版本行 -->

<div id="app">

  <!-- 主菜单 -->
  <section id="view-menu" class="view">
    <header class="menu-head">
      <h1>营销安规刷题</h1>
      <p id="menu-bank" class="sub"></p>
      <p id="menu-stats" class="sub"></p>
      <p id="menu-exam" class="sub dim"></p>
    </header>
    <div id="menu-buttons" class="grid"></div>
    <div class="menu-foot">
      <button id="btn-update" class="linkbtn">检查更新</button>
      <button id="btn-settings" class="linkbtn">模拟考试设置</button>
      <button id="btn-clear" class="linkbtn danger">清除学习记录</button>
    </div>
    <p class="foot-note">数据仅保存在本机 · 完全离线 · 无网络请求</p>
    <p id="menu-version" class="foot-note hidden"></p>
  </section>

  <!-- 刷题 / 模拟考试答题 -->
  <section id="view-quiz" class="view hidden">
    <header class="quiz-head">
      <button id="btn-back" class="backbtn">‹ 返回</button>
      <div id="quiz-title" class="qtitle"></div>
    </header>
    <main id="quiz-scroll">
      <p id="type-line" class="type-line hidden"></p>
      <div id="stem" class="stem"></div>
      <div id="options"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div id="explain-box" class="explain hidden">
        <button id="explain-toggle" type="button" class="explain-btn"></button>
        <div id="explain-body" class="explain-body hidden">
          <div class="explain-sec">
            <div class="explain-h">为什么这么选</div>
            <p id="explain-reason" class="explain-text"></p>
          </div>
          <div class="explain-sec memory">
            <div class="explain-h">记忆技巧</div>
            <p id="explain-memory" class="explain-text"></p>
          </div>
        </div>
      </div>
    </main>
    <footer class="quiz-bar">
      <button id="btn-prev" class="barbtn">上一题</button>
      <button id="btn-submit" class="barbtn primary hidden">提交答案</button>
      <button id="btn-jump" class="barbtn hidden">跳转</button>
      <button id="btn-next" class="barbtn">下一题</button>
      <button id="btn-handin" class="barbtn danger hidden">交卷</button>
    </footer>
  </section>

  <!-- 搜题 -->
  <section id="view-search" class="view hidden">
    <header class="quiz-head">
      <button id="btn-search-back" class="backbtn">‹ 返回</button>
      <div class="qtitle">搜题</div>
    </header>
    <div class="search-bar-wrap">
      <input id="search-input" type="search" placeholder="输入题干关键词" autocomplete="off"
             enterkeyhint="search" inputmode="search">
      <button id="btn-batch-photo" class="photo-btn" type="button" title="拍整页">📷</button>
    </div>
    <div id="search-filters" class="search-filters" role="group" aria-label="题型筛选">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-btn" data-filter="single" aria-pressed="false">单选</button>
      <button type="button" class="filter-btn" data-filter="multi" aria-pressed="false">多选</button>
      <button type="button" class="filter-btn" data-filter="judge" aria-pressed="false">判断</button>
    </div>
    <main id="search-scroll">
      <div id="search-history" class="search-history hidden"></div>
      <div id="search-count" class="search-count hidden"></div>
      <div id="search-results"></div>
    </main>
  </section>

  <!-- 拍照搜题（单题） -->
  <section id="view-photo" class="view hidden">
    <header class="quiz-head">
      <button id="btn-photo-back" class="backbtn">‹ 搜索</button>
      <div class="qtitle">拍照搜题</div>
    </header>
    <main class="pad">
      <button id="btn-take-photo" class="barbtn primary photo-take" type="button">📷 拍照搜题</button>
      <p id="photo-status" class="search-count hidden"></p>
      <div id="photo-preview" class="hidden"></div>
      <div id="photo-results"></div>
    </main>
  </section>

  <!-- 整页答案（SIMPLIFY_CAPTURE_FLOW_V1：相机直拍直达，无中转页） -->
  <section id="view-batch-results" class="view hidden">
    <header class="quiz-head">
      <button id="btn-batch-results-back" class="backbtn">‹ 首页</button>
      <div class="qtitle">整页答案</div>
    </header>
    <main id="batch-scroll" class="pad">
      <div id="batch-summary" class="batch-summary"></div>
      <div id="batch-list"></div>
      <div id="batch-tools"></div>
      <div id="batch-sample-tools" class="sample-tools">
        <button id="btn-sample-flag" class="linkbtn hidden" type="button">反馈本页问题</button>
        <div id="sample-feedback-panel" class="sample-feedback-panel hidden"></div>
      </div>
    </main>
  </section>

  <!-- 搜题详情 -->
  <section id="view-search-detail" class="view hidden">
    <header class="quiz-head">
      <button id="btn-detail-back" class="backbtn">‹ 搜索</button>
      <div class="qtitle">题目详情</div>
    </header>
    <main id="search-detail-body" class="pad"></main>
  </section>

  <!-- DEV 隐藏诊断（SIMPLIFY_CAPTURE_FLOW_V1：仅 DEV 构建，版本号 7 连击进入） -->
  <section id="view-devdiag" class="view hidden">
    <header class="quiz-head">
      <button id="btn-devdiag-back" class="backbtn">‹ 返回</button>
      <div class="qtitle">Developer Diagnostics</div>
    </header>
    <main id="devdiag-body" class="pad"></main>
  </section>

  <!-- 检查更新（SELF_UPDATE_V1，仅手动检查） -->
  <section id="view-update" class="view hidden">
    <header class="quiz-head">
      <button id="btn-update-back" class="backbtn">‹ 返回</button>
      <div class="qtitle">检查更新</div>
    </header>
    <main class="pad">
      <p id="update-current" class="dim"></p>
      <div id="update-body"></div>
      <p id="update-error" class="batch-hint hidden"></p>
    </main>
  </section>

  <!-- 考试成绩 -->
  <section id="view-result" class="view hidden">
    <header class="quiz-head"><div class="qtitle center">模拟考试成绩</div></header>
    <main id="result-body" class="pad"></main>
  </section>

  <!-- 考试错题回顾 -->
  <section id="view-review" class="view hidden">
    <header class="quiz-head">
      <button id="btn-review-back" class="backbtn">‹ 成绩</button>
      <div id="review-title" class="qtitle"></div>
    </header>
    <main id="review-body" class="pad"></main>
  </section>

</div>
<div id="modal-root" class="hidden"></div>

<div id="nav-report">运行中…</div>

<script>
/* 内联 fixture 题库：app.js 的 loadBank 优先读 window.QUESTIONS_DATA（与正式 app 同路径）。
   题干含 NAVTEST 标记保证搜题命中且不与其它数据混淆；题干足够长保证 OCR 匹配 high。 */
(function () {
  const S = (id, stem, opts, ans) => ({ id, major: "NAV", type: "single", stem, options: opts, answer: ans });
  const qs = [];
  const stems = [
    "NAVTEST 卡式电能表检定装置的试验变换器部分每（　）至少送检一次，检定项目包括绝缘电阻测定与工频耐压试验。",
    "NAVTEST 现场检验计量装置时，工作人员应携带试验用的仪表设备，并遵守（　）的相关安全规定。",
    "NAVTEST 计量箱（柜）内使用的开关设备应当具备（　）功能，防止因过载引发火灾事故。",
    "NAVTEST 低压带电作业应设专人监护，使用有绝缘柄的工具，工作时站在（　）上进行，同时穿戴绝缘防护用品。",
    "NAVTEST 电能计量装置的二次回路连接导线应采用铜质单芯绝缘导线，其截面积不应小于（　）平方毫米。",
    "NAVTEST 新装与拆换电能表作业开始前，应当（　）方可开展工作，防止误碰带电设备。",
    "NAVTEST 用电信息采集终端安装作业中，通信天线的安装位置应当（　），并可靠固定，避免信号遮挡。",
    "NAVTEST 现场校验电流互感器时，严禁（　），防止产生高电压危及人身与设备安全。",
    "NAVTEST 计量装置的轮换计划应结合（　）统一安排，确保现场作业与停电计划相衔接。",
    "NAVTEST 采集终端与电能表之间的通信规约应当符合（　）的要求，保证数据抄读准确可靠。",
    "NAVTEST 检定装置在使用前应当检查（　）是否完好，发现异常应当立即停止使用并登记。",
    "NAVTEST 拆装电能表时，二次侧电流回路应（　）后方可拆线，防止开路产生危险。",
    "NAVTEST 现场作业完毕后应当（　），并清理现场，确认无遗留工具后方可撤离。",
    "NAVTEST 计量自动化系统主站应当对采集数据进行（　），发现异常数据应当及时现场核实。"
  ];
  stems.forEach((stem, i) => {
    qs.push(S(9001 + i, stem, ["定期", "不定期", "按需", "口头约定"], [i % 4]));
  });
  qs.push({ id: 9101, major: "NAV", type: "multi", stem: "NAVTEST 现场校验作业时应采取的安全措施包括（　）。", options: ["专人监护", "戴绝缘手套", "先停电再作业", "随意操作"], answer: [0, 1, 2] });
  qs.push({ id: 9102, major: "NAV", type: "multi", stem: "NAVTEST 电能表接线检查的内容包括（　）。", options: ["相序正确", "极性正确", "接地可靠", "导线颜色随意"], answer: [0, 1, 2] });
  qs.push({ id: 9201, major: "NAV", type: "judge", stem: "NAVTEST 现场校验可以不办理任何手续直接进行。", options: ["正确", "错误"], answer: [1] });
  window.QUESTIONS_DATA = { total: qs.length, questions: qs };
  window.__NAV_FIXTURE = qs;

  /* OCR fixture：12 道单选题的整页行（含坐标，页面足够长可滚动） */
  window.__ocrFixture = function () {
    const lines = [];
    let y = 60;
    const singles = qs.filter((q) => q.type === "single");
    singles.forEach((q, i) => {
      const line = (t) => { lines.push({ text: t, left: 40, top: y, right: 900, bottom: y + 42 }); y += 48; };
      line((21 + i) + ". " + q.stem);
      q.options.forEach((o, k) => line("ABCD"[k] + ". " + o));
    });
    return { text: lines.map((l) => l.text).join("\n"), ms: 8, width: 1000, height: y + 100, lines };
  };
})();

  /* fake Capacitor 插件必须在 app.js boot 前就位：initSampleQueue/initDevDiagnostics/
     启动更新检查在启动期都会解析插件；Camera/Ocr 点击时才调用。 */
  window.__c = { ocr: 0, match: 0, split: 0, auto: 0, http: 0 };
  window.__feedbackCalls = [];
  window.__httpFail = 0;
  window.__queuePersisted = [];
  window.__queueFeedbacks = [];
  window.__cameraReject = null;      /* 置非空 → 下一次 getPhoto reject（CAP-S3） */
  window.__queuePersistFail = 0;     /* 置 >0 → persistSample 按次数 reject（CAP-S9） */
  window.__janitorRuns = [];
  window.__queueListener = null;
  window.Capacitor = { Plugins: {
    App: {
      getInfo: async () => ({ id: "com.jty.safetyquiz.dev", version: "1.0.15", build: "15" }),
      addListener: () => ({ remove: () => {} }),
      exitApp: () => {}
    },
    Camera: { getPhoto: async () => {
      if (window.__cameraReject) {
        const m = window.__cameraReject;
        window.__cameraReject = null;
        throw new Error(m);
      }
      return { dataUrl: "data:image/jpeg;base64,QUJD" };
    } },
    Ocr: { recognizeText: async () => { window.__c.ocr += 1; return window.__ocrFixture(); } },
    CapacitorHttp: { request: async (opts) => {
        const url = (opts && opts.url) || "";
        /* 启动更新检查（/api/update/）属于后台静默旁路，不计入上传计数 */
        if (url.indexOf("/api/update/") < 0) { window.__c.http += 1; }
        if (url.indexOf("/api/feedback") >= 0) {
          window.__feedbackCalls.push(JSON.parse(JSON.stringify(opts.data || {})));
        }
        if (window.__httpFail > 0) { window.__httpFail -= 1; return { status: 500, data: { ok: false } }; }
        return { status: 200, data: { ok: true } };
      } },
    SampleQueue: {
      setServer: async () => ({ ok: true }),
      init: async () => ({ ok: true, recovered: 0, removed: 0 }),
      addListener: (ev, cb) => { window.__queueListener = cb; return { remove: () => {} }; },
      persistSample: async (o) => {
        if (window.__queuePersistFail > 0) {
          window.__queuePersistFail -= 1;
          throw new Error("IO_ERROR disk full");
        }
        window.__queuePersisted.push({
          sampleId: o.sampleId,
          dataUrlLen: (o.photoDataUrl || "").length,
          runJson: JSON.parse(o.runJson)
        });
        return { ok: true, sampleId: o.sampleId };
      },
      persistFeedback: async (o) => {
        if (window.__queueFeedbackFail > 0) {
          window.__queueFeedbackFail -= 1;
          throw new Error("IO_ERROR");
        }
        window.__queueFeedbacks.push(JSON.parse(o.feedbackJson));
        return { ok: true, sampleId: o.sampleId };
      },
      stats: async () => ({ ok: true, pending: 0, uploading: 0, retryWait: 0, failed: 0,
        authFailed: 0, uploaded: 2, pendingBytes: 4 * 1024 * 1024 }),
      retryFailed: async () => ({ ok: true, retried: 0 }),
      cleanupFailed: async () => ({ ok: true, deleted: 0, failedToDelete: 0, bytesFreed: 0 }),
      getDiagnostics: async () => ({
        ok: true, oldestSampleAgeMs: 3600_000, lastUploadBytesPerSec: 3_900_000,
        feedbackPendingCount: 0, lastJanitorAt: Date.now() - 3600_000,
        deletedSamples: 3, deletedBytes: 48 * 1024 * 1024,
        queueBytesBefore: 300 * 1024 * 1024, queueBytesAfter: 252 * 1024 * 1024
      }),
      runJanitorNow: async () => { window.__janitorRuns.push(1); return { ok: true }; }
    }
  } };
</script>
<script src="../www/js/core.js"></script>
<script src="../www/js/sample-collector.js"></script>
<script src="../www/js/updater.js"></script>
<script src="../www/js/startup-update.js"></script>
<script src="../www/js/app.js"></script>
<script>
(async function () {
  const R = [];
  const check = (id, cond, info) => { R.push({ id, pass: !!cond, info: info == null ? "" : String(info) }); };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const poll = async (fn, timeout) => {
    const t0 = Date.now();
    while (Date.now() - t0 < (timeout || 6000)) {
      try { const v = fn(); if (v) { return v; } } catch (e) { }
      await sleep(60);
    }
    return null;
  };
  const vis = (id) => { const v = document.getElementById(id); return !!v && !v.classList.contains("hidden"); };
  let batchPhotoEverVisible = false;
  const obsBatch = () => { if (vis("view-batch-photo")) { batchPhotoEverVisible = true; } };
  setInterval(obsBatch, 30);

  try {
    await poll(() => document.querySelector("#menu-buttons button"));
    await sleep(200);

    /* fake 插件已在 fixture（app.js 之前）注入；此处仅重置计数 */
    window.__c = { ocr: 0, match: 0, split: 0, auto: 0, http: 0 };
    window.__feedbackCalls.length = 0;
    window.__httpFail = 0;
    window.__queuePersisted.length = 0;
    window.__queueFeedbacks.length = 0;

    const wrap = (name, key) => {
      const orig = window.MSQ[name];
      window.MSQ[name] = function () { window.__c[key] += 1; return orig.apply(this, arguments); };
    };
    wrap("searchPageQuestionsByOcr", "match");
    wrap("splitPageOcrLines", "split");
    wrap("recomputePageFromLines", "auto");

    /* —— NAV-A：search → detail → 左上角返回 → search —— */
    const searchBtn = document.getElementById("btn-search-entry");
    check("NAV-A0 菜单有搜题入口", !!searchBtn);
    searchBtn.click();
    check("NAV-A1 进入搜题页", vis("view-search"));
    const input = document.getElementById("search-input");
    input.value = "NAVTEST";
    input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
    await poll(() => document.querySelector("#search-results .search-item"));
    document.querySelector("#search-results .search-item").click();
    check("NAV-A2 打开题目详情", vis("view-search-detail"));
    document.getElementById("btn-detail-back").click();
    check("NAV-A3 左上角返回 → 搜题页", vis("view-search") && !vis("view-search-detail"));

    /* —— CAP-S2：旧中转页必须已从 DOM 消失 —— */
    check("CAP-S2a view-batch-photo / btn-take-page / batch-type-row 已不存在",
      !document.getElementById("view-batch-photo") &&
      !document.getElementById("btn-take-page") &&
      !document.getElementById("batch-type-row"));
    check("CAP-S2b 搜题页 📷 直接拍摄（不再有单独的整页拍照页入口）",
      !!document.getElementById("btn-batch-photo"));

    /* —— NAV-B：搜题页 📷 → 直接拍摄 → AUTO → 整页答案 —— */
    document.getElementById("btn-batch-photo").click();
    await poll(() => document.querySelector("#batch-list .batch-row"));
    await sleep(120);
    check("NAV-B1 搜题页相机 → 直接出整页答案（无中转页）", vis("view-batch-results") &&
      document.querySelectorAll("#batch-list .batch-row").length >= 10);
    check("NAV-B1b 全程未进入旧整页拍照页", !batchPhotoEverVisible);
    check("CAP-S4 拍摄固定 AUTO（run.json pageTypeMode=auto）",
      window.__queuePersisted.length >= 1 &&
      window.__queuePersisted[0].runJson.pageTypeMode === "auto" &&
      window.__queuePersisted[0].runJson.pageTypeResolutionMethod !== "manual");
    check("CAP-S6 拍摄后样本已后台自动 persist",
      window.__queuePersisted.length === 1);

    const c0 = JSON.parse(JSON.stringify(window.__c));
    /* 真实滚动通道：.view 为 min-height 时 window 滚动。
       个别 WebView 环境下 scrollTo 后 pageYOffset 需一帧才生效 → 短重试并带诊断 */
    const scrollWindowTo = async (y) => {
      for (let i = 0; i < 25; i++) {
        window.scrollTo(0, y);
        await sleep(30);
        if ((window.pageYOffset || 0) >= 40) { break; }
      }
      return window.pageYOffset || 0;
    };
    const savedY = await scrollWindowTo(100000);
    check("NAV-D0 整页答案可滚动", savedY > 40,
      "savedY=" + savedY + " sh=" + document.documentElement.scrollHeight +
      " ih=" + window.innerHeight);

    const rows = Array.from(document.querySelectorAll("#batch-list .batch-row"));
    const openRow = rows[rows.length - 2];
    openRow.click();
    const detail0 = openRow.nextElementSibling;
    const candBtns = detail0.querySelectorAll(".batch-cand");
    check("NAV-E0 某题展开且 Top3 候选可见",
      openRow.classList.contains("open") && !detail0.classList.contains("hidden") && candBtns.length >= 1);

    candBtns[Math.min(1, candBtns.length - 1)].click();
    check("NAV-B2 打开 Top2 原题详情", vis("view-search-detail"));
    document.getElementById("btn-detail-back").click();
    check("NAV-B3 左上角返回 → 整页答案", vis("view-batch-results") && !vis("view-search-detail"));
    check("NAV-D1 滚动位置恢复（window 通道）",
      Math.abs((window.pageYOffset || 0) - savedY) <= 3,
      window.pageYOffset + " vs " + savedY);
    check("NAV-E1 返回后展开/Top3 状态自然保留",
      openRow.classList.contains("open") && !openRow.nextElementSibling.classList.contains("hidden") &&
      openRow.nextElementSibling.querySelectorAll(".batch-cand").length === candBtns.length);

    /* —— NAV-C：Top3 → 系统 back（handleBack 即系统返回唯一入口） —— */
    candBtns[candBtns.length - 1].click();
    check("NAV-C1 再次打开 Top3 详情（来源仍为 batch-results）", vis("view-search-detail"));
    window.handleBack();
    check("NAV-C2 系统 back → 整页答案", vis("view-batch-results") && !vis("view-search-detail"));

    /* —— NAV-F/G/H：详情返回零重算、零上传 —— */
    check("NAV-F OCR 调用 = 0（无重新识别）", window.__c.ocr === c0.ocr, "ocr=" + window.__c.ocr);
    check("NAV-G match/split/auto 调用 = 0（无重新分题匹配/无 AUTO 重判）",
      window.__c.match === c0.match && window.__c.split === c0.split && window.__c.auto === c0.auto,
      JSON.stringify(window.__c));
    check("NAV-H 样本上传调用 = 0", window.__c.http === 0);

    /* —— CAP-S5：结果页题型人工纠错保留（零重新 OCR） —— */
    const ocrBeforeSwitch = window.__c.ocr;
    const autoBeforeSwitch = window.__c.auto;
    const typeLine = document.querySelector("#batch-summary .batch-type-line");
    check("CAP-S5a 结果页有题型行与修改入口", !!typeLine);
    typeLine.querySelector(".linkbtn").click();   /* 展开 [auto/single/multi/judge] */
    const switchBtns = typeLine.querySelectorAll(".batch-type-switch .batch-type-btn");
    check("CAP-S5b 切换行含 auto/单选/多选/判断", switchBtns.length === 4);
    Array.from(switchBtns).find((b) => b.textContent === "单选题").click();
    await sleep(150);
    check("CAP-S5c 切单选 → 重算出结果且零重新 OCR",
      vis("view-batch-results") && window.__c.ocr === ocrBeforeSwitch &&
      window.__c.auto === autoBeforeSwitch + 1 &&
      document.querySelectorAll("#batch-list .batch-row").length >= 1);
    Array.from(document.querySelectorAll("#batch-summary .batch-type-switch .batch-type-btn"))
      .find((b) => b.textContent === "自动").click();
    await sleep(150);
    check("CAP-S5d 可切回 auto", vis("view-batch-results"));

    /* —— NAV-J：一次 back 一层；整页答案 Back → 首页 —— */
    window.handleBack();
    check("NAV-J1 整页答案 back → 首页（旧中转页已删，不空转）",
      vis("view-menu") && !vis("view-batch-results") && !vis("view-search"));

    /* —— CAP-S1：首页相机入口按钮直接拍摄 —— */
    check("CAP-S1a 首页有 📷 拍整页搜题入口", !!document.getElementById("btn-camera-entry"));
    document.getElementById("btn-camera-entry").click();
    await poll(() => document.querySelector("#batch-list .batch-row"));
    await sleep(120);
    check("CAP-S1b 首页相机 → 直接拍摄 → 整页答案", vis("view-batch-results"));

    /* —— CAP-S3：相机取消 → 回首页 —— */
    window.__cameraReject = "No image captured (cancelled)";
    document.getElementById("btn-camera-entry").click();
    await sleep(150);
    check("CAP-S3 相机取消 → 静默回首页（无 Modal、无残留页）",
      vis("view-menu") && !vis("view-batch-results") &&
      document.getElementById("modal-root").classList.contains("hidden"));

    /* —— CAP-S8/9/10：样本持久化失败完全静默，拍题/结果不受影响 —— */
    window.__queuePersistFail = 1;
    document.getElementById("btn-camera-entry").click();
    await poll(() => document.querySelector("#batch-list .batch-row"));
    await sleep(250);
    const toasts = Array.from(document.querySelectorAll(".fb-toast"))
      .map((t) => t.textContent).join("|");
    check("CAP-S9 persist 失败无 toast/modal/状态提示，结果页照常",
      vis("view-batch-results") &&
      !/样本|同步/.test(toasts) &&
      document.getElementById("modal-root").classList.contains("hidden"));
    check("CAP-S10 上传类错误对用户不可见（页面无同步/失败文案）",
      document.body.innerText.indexOf("同步失败") < 0 &&
      document.body.innerText.indexOf("样本同步") < 0);

    /* —— CAP-S17/18：普通 UI 无采集配置、无域名 —— */
    check("CAP-S17 无样本采集配置元素",
      !document.getElementById("sample-panel") && !document.getElementById("sample-enabled") &&
      !document.getElementById("btn-sample-cleanup") && !document.getElementById("btn-sample-test") &&
      !document.getElementById("btn-sample-retry"));
    check("CAP-S18 页面文案无服务器/CDN/COS 域名",
      document.body.innerText.indexOf("shiinalab") < 0 &&
      document.body.innerText.indexOf("服务器：") < 0);

    /* —— FB：真实样本反馈（用户主动业务交互，保留） —— */
    function fireTouch(el, type, x, y) {
      const t = new Touch({ identifier: 1, target: el, clientX: x, clientY: y });
      el.dispatchEvent(new TouchEvent(type, {
        touches: type === "touchend" ? [] : [t],
        changedTouches: [t], bubbles: true, cancelable: true
      }));
    }
    const fbSleep = (ms) => new Promise((r3) => setTimeout(r3, ms));

    const fbFlag = document.getElementById("btn-sample-flag");
    check("FB-P3 新 sample 反馈按钮可见且未反馈",
      !fbFlag.classList.contains("hidden") && fbFlag.textContent.indexOf("反馈本页问题") === 0,
      fbFlag.textContent);
    check("FB-P4a 反馈工具区可见（仅反馈入口，无采集状态）",
      !document.getElementById("batch-sample-tools").classList.contains("hidden") &&
      !document.getElementById("batch-sample-status"));

    fbFlag.click();
    const panel = document.getElementById("sample-feedback-panel");
    check("FB-P1 面板展开且 4 个分类 chip",
      !panel.classList.contains("hidden") && panel.querySelectorAll(".feedback-chip").length === 4);
    const chips = panel.querySelectorAll(".feedback-chip");
    chips[0].click();
    chips[3].click();
    panel.querySelectorAll(".feedback-btn")[0].click();
    await fbSleep(100);
    check("FB-P2 提交后按钮变为本页已反馈",
      fbFlag.textContent.indexOf("本页已反馈") === 0, fbFlag.textContent);
    let fbBody = window.__queueFeedbacks[window.__queueFeedbacks.length - 1];
    check("FB-P2 反馈已持久化（page set：missing_question+other）",
      fbBody && fbBody.schemaVersion === 2 &&
      fbBody.pageIssues.map((p) => p.type).join() === "missing_question,other" &&
      fbBody.sampleId.indexOf("2026") === 0, JSON.stringify(fbBody));

    const fbRows = Array.from(document.querySelectorAll("#batch-list .batch-row"));
    const row2 = fbRows[2], row3 = fbRows[3];
    fireTouch(row2, "touchstart", 10, 10);
    await fbSleep(750);
    fireTouch(row2, "touchend", 10, 10);
    await fbSleep(100);
    check("FB-B1 长按 block2 → 已标错",
      !!row2.querySelector(".batch-wrongmark"));
    fbBody = window.__queueFeedbacks[window.__queueFeedbacks.length - 1];
    check("FB-B4 block 反馈持久化字段完整",
      fbBody.blockIssues.length === 1 && fbBody.blockIssues[0].blockIndex === 2 &&
      fbBody.blockIssues[0].issue === "wrong_answer" &&
      "screenNumber" in fbBody.blockIssues[0] && "finalAnswer" in fbBody.blockIssues[0] &&
      "confidence" in fbBody.blockIssues[0] && "finalBankId" in fbBody.blockIssues[0] &&
      "rawScreenNumber" in fbBody.blockIssues[0] && "numberSource" in fbBody.blockIssues[0] &&
      "matchedByOptions" in fbBody.blockIssues[0], JSON.stringify(fbBody));

    /* —— CAP-S11：反馈持久化失败静默（提交动作仍表现为已记录） —— */
    window.__queueFeedbackFail = 1;
    window.__queueFeedbacks.length = 0;
    fireTouch(row3, "touchstart", 10, 10);
    await fbSleep(750);
    fireTouch(row3, "touchend", 10, 10);
    await fbSleep(150);
    check("CAP-S11 反馈落盘失败：无保存失败提示，标错 UI 正常",
      !!row3.querySelector(".batch-wrongmark") &&
      !/反馈保存失败/.test(Array.from(document.querySelectorAll(".fb-toast"))
        .map((t) => t.textContent).join("|")) &&
      document.getElementById("modal-root").classList.contains("hidden"));

    /* —— FB-P4：新 sample 重置反馈状态（重新拍摄按钮） —— */
    window.__queueFeedbacks.length = 0;
    document.querySelector("#batch-tools .barbtn").click();   /* 重新拍摄 = 新 sample */
    await poll(() => document.querySelector("#batch-list .batch-row"));
    await fbSleep(250);
    check("FB-P4 新 sample 反馈按钮重置为未反馈",
      document.getElementById("btn-sample-flag").textContent.indexOf("反馈本页问题") === 0,
      document.getElementById("btn-sample-flag").textContent);
    check("FB-U1 新 sample 独立落盘（队列持久化记录递增）",
      window.__queuePersisted.length >= 3, String(window.__queuePersisted.length));
    check("FB-Q 新旧 sample 数据互不覆盖（sampleId 不同）",
      window.__queuePersisted[0].sampleId !== window.__queuePersisted[window.__queuePersisted.length - 1].sampleId);

    /* —— CAP-S19：DEV 隐藏诊断（版本行 7 连击） —— */
    const ver = document.getElementById("menu-version");
    check("CAP-S19a DEV 构建显示版本行（fake App 为 dev 包名）",
      !!ver && !ver.classList.contains("hidden") && /版本 1\.0\.15（15）/.test(ver.textContent),
      ver && ver.textContent);
    window.__janitorRuns.length = 0;
    for (let i = 0; i < 7; i++) { ver.click(); }
    await sleep(100);
    check("CAP-S19b 7 连击进入 Developer Diagnostics",
      vis("view-devdiag") && document.getElementById("devdiag-body").innerText.indexOf("pending") >= 0);
    check("CAP-S19c 诊断页含 janitor 记录与重试入口，无凭据/域名",
      document.getElementById("devdiag-body").innerText.indexOf("janitor") >= 0 &&
      document.getElementById("devdiag-body").innerText.indexOf("Run janitor now") >= 0 &&
      document.body.innerText.indexOf("shiinalab") < 0 &&
      document.body.innerText.indexOf("Bearer") < 0);
    Array.from(document.querySelectorAll("#devdiag-body .barbtn"))
      .find((b) => b.textContent === "Run janitor now").click();
    await sleep(150);
    check("CAP-S19e Run janitor now 可触发（fake 记录）", window.__janitorRuns.length >= 1);
    document.getElementById("btn-devdiag-back").click();
    check("CAP-S19d 返回首页", vis("view-menu"));
  } catch (e) {
    R.push({ id: "HARNESS", pass: false, info: String((e && e.stack) || e) });
  }

  window.__NAV_RESULTS = R;
  const box = document.getElementById("nav-report");
  box.innerHTML = "";
  let fails = 0;
  R.forEach((r) => {
    if (!r.pass) { fails += 1; }
    const p = document.createElement("div");
    p.className = r.pass ? "pass" : "fail";
    p.textContent = "[" + (r.pass ? "PASS" : "FAIL") + "] " + r.id + (r.info ? "  (" + r.info + ")" : "");
    box.appendChild(p);
  });
  const head = document.createElement("h3");
  head.textContent = "结果：" + (fails ? fails + " 项失败 ✗" : "全部通过 ✓") + "（" + R.length + " 项）";
  head.className = fails ? "fail" : "pass";
  box.insertBefore(head, box.firstChild);
  console.log("NAV_RESULTS", JSON.stringify(R));
})();
</script>
</body>
</html>
